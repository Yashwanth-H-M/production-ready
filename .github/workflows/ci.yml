name: Production checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run clean
      - run: npm run build
      - name: Check production dependencies
        run: npm audit --omit=dev

  backend:
    name: Backend tests, including PostgreSQL RLS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run backend test suite
        run: mvn --batch-mode --no-transfer-progress test
      - name: Require the real PostgreSQL integration test to run
        working-directory: .
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          reports = glob.glob("backend/target/surefire-reports/TEST-*PostgresRlsIntegrationTest.xml")
          if len(reports) != 1:
              sys.exit(f"Expected one PostgreSQL RLS test report, found {len(reports)}")
          suite = ET.parse(reports[0]).getroot()
          tests = int(suite.attrib.get("tests", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          failures = int(suite.attrib.get("failures", "0")) + int(suite.attrib.get("errors", "0"))
          if tests < 2 or skipped != 0 or failures != 0:
              sys.exit(f"PostgreSQL RLS gate failed: tests={tests}, skipped={skipped}, failures={failures}")
          print(f"PostgreSQL RLS gate passed: tests={tests}, skipped={skipped}, failures={failures}")
          PY
