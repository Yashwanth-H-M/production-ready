# Production must use Clerk. The local HS256 demo path is not available here.
app.auth.provider=clerk
app.local-demo-auth-enabled=false
app.clerk.issuer=${CLERK_ISSUER}
app.clerk.jwks-uri=${CLERK_JWKS_URL}
app.clerk.audience=${CLERK_API_AUDIENCE:canopy-api}

# Render supplies these non-secret values from its PostgreSQL resource. The
# application role credentials are separate secret environment variables.
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:${DATABASE_PORT:5432}/${DATABASE_NAME}
