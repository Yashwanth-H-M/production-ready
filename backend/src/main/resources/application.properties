spring.application.name=nursery-crm-backend
server.port=${PORT:8080}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nursery_crm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:nursery}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:nursery}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT secret must be supplied by the runtime environment. Docker Compose provides a local-only value.
jwt.secret=${JWT_SECRET:}
app.auth.provider=${AUTH_PROVIDER:local}
app.clerk.issuer=${CLERK_ISSUER:}
app.clerk.jwks-uri=${CLERK_JWKS_URL:}
app.clerk.audience=${CLERK_API_AUDIENCE:canopy-api}

# Local demo authentication is disabled unless explicitly enabled by the local Compose profile.
app.local-demo-auth-enabled=${LOCAL_DEMO_AUTH_ENABLED:false}
app.local-demo-user-id=${LOCAL_DEMO_USER_ID:b0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11}
app.local-demo-tenant-id=${LOCAL_DEMO_TENANT_ID:a0eebc99-9c0b-4ef8-bb6d-6bb9bd380a11}
app.local-demo-email=${LOCAL_DEMO_EMAIL:admin@greenvalley.com}

# Always true for PostgreSQL application runs; tests set this false for H2.
app.tenant-context-sql-enabled=${TENANT_CONTEXT_SQL_ENABLED:true}

# Detailed application and security logs
logging.level.root=INFO
logging.level.com.nurserycrm=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.jdbc.core=DEBUG
