<style>
#erd svg.erDiagram .divider path { stroke-opacity: 0.5; }
#erd svg.erDiagram .row-rect-odd path,
#erd svg.erDiagram .row-rect-odd rect,
#erd svg.erDiagram .row-rect-even path,
#erd svg.erDiagram .row-rect-even rect { stroke: none !important; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
  },
});
const { svg } = await mermaid.render('erd-svg', `erDiagram
  TENANTS ||--o{ USERS : has
  GREENHOUSE_ZONES ||--o{ PLANT_BATCHES : contains
  GREENHOUSE_ZONES ||--o{ SENSOR_READINGS : monitored_by
  PLANT_BATCHES ||--o{ BATCH_EVENTS : logs
  PLANT_BATCHES ||--o{ TREATMENTS : receives
  PLANT_BATCHES ||--o{ DIAGNOSTIC_LOGS : has
  PLANT_BATCHES ||--o{ ORDER_LINE_ITEMS : fulfills
  ORDERS ||--o{ ORDER_LINE_ITEMS : contains
  USERS ||--o{ BATCH_EVENTS : records
  USERS ||--o{ DIAGNOSTIC_LOGS : reviews

  TENANTS {
    uuid id PK
    string name
  }
  USERS {
    uuid id PK
    uuid tenant_id FK
    string email
    string role
  }
  GREENHOUSE_ZONES {
    uuid id PK
    uuid tenant_id FK
    string name
    jsonb microclimate
  }
  PLANT_BATCHES {
    uuid id PK
    uuid tenant_id FK
    uuid zone_id FK
    string species
    string status
    int quantity_current
    numeric unit_cost
  }
  BATCH_EVENTS {
    uuid id PK
    uuid tenant_id FK
    uuid batch_id FK
    uuid recorded_by FK
    string event_type
    timestamp occurred_at
  }
  TREATMENTS {
    uuid id PK
    uuid tenant_id FK
    uuid batch_id FK
    string product_name
    date safe_ship_date
  }
  DIAGNOSTIC_LOGS {
    uuid id PK
    uuid tenant_id FK
    uuid batch_id FK
    uuid reviewed_by FK
    string cv_prediction
    boolean needs_review
  }
  SENSOR_READINGS {
    uuid tenant_id FK
    uuid zone_id FK
    timestamp reading_time
    numeric moisture
    numeric temperature
  }
  ORDERS {
    uuid id PK
    uuid tenant_id FK
    string order_type
    string status
  }
  ORDER_LINE_ITEMS {
    uuid id PK
    uuid tenant_id FK
    uuid order_id FK
    uuid batch_id FK
    int promised_qty
  }`);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg.erDiagram .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg.erDiagram .row-rect-odd path, #erd svg.erDiagram .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
